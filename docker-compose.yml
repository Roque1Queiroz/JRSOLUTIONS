version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mei_gestao_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-mei_gestao}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina a senha do PostgreSQL no .env}
    # Sem "ports": o banco fica acessível apenas pela rede interna do Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mei_gestao_redis
    # Sem "ports": o Redis fica acessível apenas pela rede interna do Compose.

  web:
    build: .
    container_name: mei_gestao_app
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Expõe apenas em loopback (127.0.0.1). O acesso externo deve ser feito
    # por um proxy reverso (nginx) ou túnel SSH; nunca diretamente à porta 8000.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1

  worker:
    build: .
    container_name: mei_gestao_worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis

  beat:
    build: .
    container_name: mei_gestao_beat
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
