{% load static %}

{% block title %}{{ empresa.nome }}{% endblock %}

                </div>

                        <div class="col-md-6">
                            <h6 class="text-muted">CNPJ</h6>

                        </div>

                                    <span class="badge bg-danger">Inativa</span>
                                {% endif %}

                        </div>
                    </div>
