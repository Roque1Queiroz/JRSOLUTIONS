{% extends "meigestao_app/almoxarifado/base_almoxarifado.html" %}

{% block content %}
<div class="row animate-init">
    <div class="col-md-6 mx-auto">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <div class="bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
                    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Excluir Setor?</h3>
                <p class="text-muted mb-4">
                    Você está prestes a excluir o setor <strong>{{ object.nome }}</strong>. 
                    Esta ação não pode ser desfeita se não houver requisições vinculadas.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-3 fw-bold text-uppercase">SIM, EXCLUIR DEFINITIVAMENTE</button>
                        <a href="{% url 'almoxarifado:setor_list' %}" class="btn btn-light border py-3 fw-bold text-uppercase">CANCELAR</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
