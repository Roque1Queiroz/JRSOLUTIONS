{% extends "base.html" %}

{% block title %}Deletar Produto{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="alert alert-danger">
                <h4>Tem certeza que deseja deletar este produto?</h4>
                <p><strong>Nome:</strong> {{ produto.nome }}</p>
                <p><strong>Preço:</strong> R$ {{ produto.preco|floatformat:2 }}</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sim, deletar</button>
                <a href="{% url 'estoque:produto_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
